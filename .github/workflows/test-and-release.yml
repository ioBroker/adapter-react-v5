# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2.0.0
              with:
                  node-version: '24.x'
                  # `npm run check` type-checks the sources. Among other things it enforces that
                  # `TYPE_ICONS` covers every device type of `@iobroker/type-detector`.
                  type-checking: true
                  lint: true
                  # Checks that icons and translations stay in sync with `@iobroker/type-detector`
                  test-command: 'npm run check-device-types'

    # Deploys the final package to NPM
    deploy:
        needs: [check-and-lint]

        # Permissions are required to create GitHub releases and npm trusted publishing
        permissions:
            contents: write
            id-token: write

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}
